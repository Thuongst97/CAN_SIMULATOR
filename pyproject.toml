[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosim-studio"
version = "0.1.0"
description = "CAN / CAN FD simulation and analysis suite"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "cantools>=39",
    "python-can>=4.3",
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.4", "mypy>=1.10", "psutil>=5.9"]   # psutil: tools/ui/perf_trace.py
build = ["pyinstaller>=6.6"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
autosim = "autosim.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

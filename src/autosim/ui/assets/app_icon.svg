<?xml version="1.0" encoding="UTF-8"?>
<!-- ICAN app icon: blue tile, "ICAN", and a CAN_H / CAN_L differential signal below it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B8EE0"/>
      <stop offset="1" stop-color="#0F5FA8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#tile)"/>
  <text x="128" y="128" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif"
        font-weight="800" font-size="82" letter-spacing="-2">ICAN</text>
  <!-- CAN_H (white) goes up, CAN_L (light blue) goes down on each dominant bit -->
  <polyline points="36,176 66,176 66,156 104,156 104,176 128,176 128,156 150,156 150,176 220,176" fill="none"
            stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="36,186 66,186 66,206 104,206 104,186 128,186 128,206 150,206 150,186 220,186" fill="none"
            stroke="#9FD0FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

# Builds the Tauri desktop app (AutoSim Studio: web UI in a native window, Python backend bundled) on a Windows
# runner. Result: the artifact "AutoSimStudio-Tauri-Setup" (NSIS installer). Runs on a push to main / tauri /
# ui-pro, or by hand; run by hand with "release" set (e.g. v1.1.0) it also publishes a GitHub release with the
# installer (the tag is created on that commit).
name: Build Tauri app (Windows)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. v1.1.0); empty = build only"
        required: false
        default: ""
  push:
    branches: [main, tauri, ui-pro]

permissions:
  contents: write          # only used to publish a release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Tests (web mode)
        shell: pwsh
        run: |
          uv sync --frozen --extra web
          uv run --frozen python -m pytest -q -p no:cacheprovider tests/test_web.py tests/test_web_test_api.py

      - name: Backend (PyInstaller, web mode)
        shell: pwsh
        run: |
          uv sync --frozen --group build --extra web
          uv run --frozen --group build python -m PyInstaller packaging\autosim_web.spec --noconfirm --distpath dist --workpath build\web
          if ($LASTEXITCODE) { throw "PyInstaller failed" }

      - name: Tauri app + NSIS installer
        shell: pwsh
        working-directory: tauri
        run: |
          npm ci
          npx tauri build --bundles nsis
          if ($LASTEXITCODE) { throw "tauri build failed" }

      - name: Smoke test (app starts its backend, the backend stops with the app)
        shell: pwsh
        run: |
          $app = Start-Process tauri\src-tauri\target\release\autosim-studio.exe -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep 1
            try { $s = Invoke-RestMethod http://127.0.0.1:6789/api/state; $ok = $true; break } catch {}
          }
          if (-not $ok) { Get-Content "$env:APPDATA\com.autosim.studio\backend.log" -ErrorAction SilentlyContinue; throw "backend did not answer" }
          if (-not ($s.ports | Where-Object { $_.port -eq "SIM1" })) { throw "unexpected /api/state" }
          # on the network (0.0.0.0): another machine needs the token, this PC (the window) does not
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          $code = 0
          try { Invoke-WebRequest "http://${ip}:6789/api/state" -UseBasicParsing | Out-Null; $code = 200 } catch { $code = [int]$_.Exception.Response.StatusCode }
          "From ${ip} without the token: HTTP $code"
          if ($code -ne 401) { Stop-Process $app.Id -Force; throw "expected 401 from another address, got $code" }
          $tok = (Get-Content "$env:APPDATA\com.autosim.studio\token.txt" -Raw).Trim()
          Invoke-RestMethod "http://${ip}:6789/api/state" -Headers @{ "X-AutoSim-Token" = $tok } | Out-Null
          "OK: listening on the network, token required from ${ip}"
          Stop-Process $app.Id -Force
          Start-Sleep 4
          if (Get-Process AutoSimWeb -ErrorAction SilentlyContinue) { throw "backend still running after the app was closed" }
          "OK: backend answered and stopped with the app"

      - name: Installed app shows one window (installer, then the app as a user starts it)
        shell: pwsh
        run: |
          # every visible top-level window, with what decides whether a user sees it: size, styles, owner, taskbar
          Add-Type -TypeDefinition @"
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class Wins {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern IntPtr GetWindow(IntPtr h, uint cmd);
            [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr h, int i);
            public static List<string> List() {
              var r = new List<string>();
              EnumWindows((h, l) => {
                if (!IsWindowVisible(h)) return true;
                var t = new StringBuilder(256); GetWindowText(h, t, 256); var c = new StringBuilder(256); GetClassName(h, c, 256);
                uint pid; GetWindowThreadProcessId(h, out pid); RECT rc; GetWindowRect(h, out rc);
                int st = GetWindowLong(h, -16), ex = GetWindowLong(h, -20); IntPtr owner = GetWindow(h, 4);
                bool tool = (ex & 0x80) != 0, appw = (ex & 0x40000) != 0;
                bool taskbar = appw || (owner == IntPtr.Zero && !tool);
                int w = rc.R - rc.L, hh = rc.B - rc.T;
                bool seen = taskbar && w > 1 && hh > 1 && (ex & 0x20) == 0;
                r.Add(h + "|" + pid + "|" + (seen ? "SEEN" : "hidden") + "|" + w + "x" + hh + "|style=" + st.ToString("X8") + "|ex=" + ex.ToString("X8") +
                      "|owner=" + owner + "|class=" + c + "|" + t);
                return true; }, IntPtr.Zero);
              return r;
            }
          }
          "@
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          function Shot($path) { $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp.Save($path); $g.Dispose(); $bmp.Dispose() }
          function Windows { [Wins]::List() | ForEach-Object { $f = $_ -split '\|'
            $n = (Get-Process -Id $f[1] -ErrorAction SilentlyContinue).ProcessName; "$n | $_" } }
          New-Item -ItemType Directory -Force shots | Out-Null
          $setup = Get-ChildItem tauri\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs" -Recurse -Filter autosim-studio.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed app not found" }
          "Installed: $($exe.FullName)"
          $before = Windows | ForEach-Object { ($_ -split '\|')[1].Trim() }
          $app = Start-Process $exe.FullName -PassThru
          foreach ($i in 1..40) { Start-Sleep 1; try { Invoke-RestMethod http://127.0.0.1:6789/api/state | Out-Null; break } catch {} }
          Start-Sleep 5
          Shot "shots\installed_app.png"
          $new = @(Windows | Where-Object { $before -notcontains ($_ -split '\|')[1].Trim() })
          "New visible windows (process | handle | pid | SEEN/hidden | size | styles | owner | class | title):"; $new
          Get-Content "$env:APPDATA\com.autosim.studio\backend.log" -ErrorAction SilentlyContinue | Select-Object -First 3
          $seen = @($new | Where-Object { $_ -match '\|SEEN\|' })
          if ($seen.Count -ne 1) { Stop-Process $app.Id -Force; throw "a user sees $($seen.Count) windows, expected 1" }
          "OK: the user sees one window"
          # a second start (e.g. the installer started it, then the user clicks the icon): no second window
          $second = Start-Process $exe.FullName -PassThru
          if (-not $second.WaitForExit(15000)) { throw "the second copy did not exit" }
          Start-Sleep 2
          $seen2 = @(Windows | Where-Object { $before -notcontains ($_ -split '\|')[1].Trim() } | Where-Object { $_ -match '\|SEEN\|' })
          $copies = @(Get-Process autosim-studio -ErrorAction SilentlyContinue).Count
          "After a second start: $($seen2.Count) window(s), $copies app process(es)"
          Stop-Process $app.Id -Force; Start-Sleep 3
          if ($seen2.Count -ne 1 -or $copies -ne 1) { throw "a second start opened another window" }
          "OK: a second start shows the running window"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-app-screenshot
          path: shots/*.png
          if-no-files-found: ignore

      - name: Size
        shell: pwsh
        run: Get-ChildItem tauri\src-tauri\target\release\bundle\nsis\*.exe | ForEach-Object { "{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSimStudio-Tauri-Setup
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Release (run by hand with "release")
        if: inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release }}
          target_commitish: ${{ github.sha }}
          name: AutoSim Studio ${{ inputs.release }}
          body_path: docs/RELEASE_NOTES.md
          files: tauri/src-tauri/target/release/bundle/nsis/*.exe

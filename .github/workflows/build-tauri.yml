# Builds the Tauri desktop app (AutoSim Studio: web UI in a native window, Python backend bundled) on a Windows
# runner. Result: the artifact "AutoSimStudio-Tauri-Setup" (NSIS installer). Runs on a push to main / tauri /
# ui-pro, or by hand; run by hand with "release" set (e.g. v1.1.0) it also publishes a GitHub release with the
# installer (the tag is created on that commit).
name: Build Tauri app (Windows)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (e.g. v1.1.0); empty = build only"
        required: false
        default: ""
  push:
    branches: [main, tauri, ui-pro]

permissions:
  contents: write          # only used to publish a release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Tests (web mode)
        shell: pwsh
        run: |
          uv sync --frozen --extra web
          uv run --frozen python -m pytest -q -p no:cacheprovider tests/test_web.py tests/test_web_test_api.py

      - name: Backend (PyInstaller, web mode)
        shell: pwsh
        run: |
          uv sync --frozen --group build --extra web
          uv run --frozen --group build python -m PyInstaller packaging\autosim_web.spec --noconfirm --distpath dist --workpath build\web
          if ($LASTEXITCODE) { throw "PyInstaller failed" }

      - name: Tauri app + NSIS installer
        shell: pwsh
        working-directory: tauri
        run: |
          npm ci
          npx tauri build --bundles nsis
          if ($LASTEXITCODE) { throw "tauri build failed" }

      - name: Smoke test (app starts its backend, the backend stops with the app)
        shell: pwsh
        run: |
          $app = Start-Process tauri\src-tauri\target\release\autosim-studio.exe -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep 1
            try { $s = Invoke-RestMethod http://127.0.0.1:8765/api/state; $ok = $true; break } catch {}
          }
          if (-not $ok) { Get-Content "$env:APPDATA\com.autosim.studio\backend.log" -ErrorAction SilentlyContinue; throw "backend did not answer" }
          if (-not ($s.ports | Where-Object { $_.port -eq "SIM1" })) { throw "unexpected /api/state" }
          Stop-Process $app.Id -Force
          Start-Sleep 4
          if (Get-Process AutoSimWeb -ErrorAction SilentlyContinue) { throw "backend still running after the app was closed" }
          "OK: backend answered and stopped with the app"

      - name: Installed app shows one window (installer, then the app as a user starts it)
        shell: pwsh
        run: |
          # every visible top-level window: "pid | process | title"
          Add-Type -TypeDefinition @"
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class Wins {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            public static List<string> List() {
              var r = new List<string>();
              EnumWindows((h, l) => { if (IsWindowVisible(h)) { var sb = new StringBuilder(256); GetWindowText(h, sb, 256); uint pid;
                GetWindowThreadProcessId(h, out pid); r.Add(h + "|" + pid + "|" + sb); } return true; }, IntPtr.Zero);
              return r;
            }
          }
          "@
          function Windows { [Wins]::List() | ForEach-Object { $h, $p, $t = $_ -split '\|', 3
            $n = (Get-Process -Id $p -ErrorAction SilentlyContinue).ProcessName; "$h | $p | $n | $t" } }
          $setup = Get-ChildItem tauri\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs" -Recurse -Filter autosim-studio.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "installed app not found" }
          "Installed: $($exe.FullName)"
          Get-ChildItem (Split-Path $exe.FullName) -Recurse | Select-Object -ExpandProperty FullName | Select-Object -First 15
          $before = Windows
          $app = Start-Process $exe.FullName -PassThru
          foreach ($i in 1..40) { Start-Sleep 1; try { Invoke-RestMethod http://127.0.0.1:8765/api/state | Out-Null; break } catch {} }
          Start-Sleep 4
          $new = Windows | Where-Object { $before -notcontains $_ }
          "New visible windows:"; $new
          "Processes:"; Get-Process | Where-Object { $_.ProcessName -match "autosim|AutoSimWeb|conhost|OpenConsole|WindowsTerminal|msedgewebview2" } |
            Format-Table Id, ProcessName, MainWindowTitle -AutoSize | Out-String
          Get-Content "$env:APPDATA\com.autosim.studio\backend.log" -ErrorAction SilentlyContinue | Select-Object -First 5
          Stop-Process $app.Id -Force; Start-Sleep 3
          $ours = @($new | Where-Object { $_ -notmatch '\| (msedgewebview2) \|' })
          if ($ours.Count -ne 1) { throw "expected 1 new window, got $($ours.Count)" }
          "OK: one window"

      - name: Size
        shell: pwsh
        run: Get-ChildItem tauri\src-tauri\target\release\bundle\nsis\*.exe | ForEach-Object { "{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSimStudio-Tauri-Setup
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Release (run by hand with "release")
        if: inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release }}
          target_commitish: ${{ github.sha }}
          name: AutoSim Studio ${{ inputs.release }}
          body_path: docs/RELEASE_NOTES.md
          files: tauri/src-tauri/target/release/bundle/nsis/*.exe

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSim Studio</title>
<style>
  :root { color-scheme: light dark; --bg: #F4F6F8; --fg: #0F172A; --muted: #64748B; --accent: #047857; --err: #DC2626; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1B1D22; --fg: #E6E8EC; --muted: #9EA2B0; --err: #F87171; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 14px "Segoe UI", system-ui, sans-serif; }
  .box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .logo { width: 72px; height: 72px; }
  .spin { width: 22px; height: 22px; border: 3px solid var(--muted); border-top-color: var(--accent); border-radius: 50%;
    animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .muted { color: var(--muted); }
  pre { color: var(--err); white-space: pre-wrap; max-width: 640px; text-align: left; }
</style>
</head>
<body>
<div class="box" id="box" data-tauri-drag-region>   <!-- no native title bar: drag the window here -->
  <img class="logo" src="icon.svg" alt="ICAN">
  <h2 style="margin:0">AutoSim Studio</h2>
  <div class="spin" id="spin"></div>
  <div class="muted" id="msg">Starting the CAN engine…</div>
  <pre id="err" hidden></pre>
</div>
<script>
  // Called by the app (lib.rs) when the backend cannot start.
  window.showStartError = (text) => {
    document.getElementById("spin").hidden = true;
    document.getElementById("msg").textContent = "AutoSim Studio could not start its CAN engine.";
    const e = document.getElementById("err"); e.textContent = text; e.hidden = false;
  };
</script>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<!-- ICAN app icon (the PNG / ICO sizes are drawn by tools/ui/make_ican_icon.py): a blue tile, ICAN as wide as it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F6CBD"/><stop offset="1" stop-color="#0C589E"/></linearGradient>
  </defs>
  <rect x="5" y="5" width="246" height="246" rx="50" fill="url(#g)"/>
  <text x="128" y="164" text-anchor="middle" fill="#FFFFFF" textLength="192" lengthAdjust="spacingAndGlyphs"
        font-family="Arial Narrow, Nimbus Sans Narrow, Roboto Condensed, Arial, sans-serif" font-weight="700" font-size="104">ICAN</text>
</svg>

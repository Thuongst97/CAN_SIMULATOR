; AutoSim CAN FD node firmware: ESP32 + MCP2518FD  (protocol: docs/ESP32_PROTOCOL.md)
;
;   pio run -e esp32dev            build for classic ESP32 (UART bridge on UART0, 921600 baud)
;   pio run -e esp32s3_uart        build for ESP32-S3 on its UART/CH343 port (921600 baud)
;   pio run -e esp32s3             build for ESP32-S3 (native USB-CDC, the port labelled "USB")
;   pio run -e esp32c3             build for ESP32-C3 (native USB-CDC, single core)
;   pio run -e esp32dev -t upload  flash
;   pio test -e native             run the host unit tests (protocol / node logic, no hardware)

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 921600
lib_deps =
    pierremolinaro/ACAN2517FD
build_flags =
    -Wall -Wextra
    -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17

[env:esp32dev]
platform = espressif32
board = esp32dev
; classic ESP32 boards expose the host link through a USB-UART bridge on UART0
build_flags =
    ${env.build_flags}
    -DAUTOSIM_LINK_UART=1

; ESP32-S3 boards with a USB-UART bridge (CH343 / CP210x, the port labelled "UART"): Serial = UART0 (GPIO43 TX / 44 RX)
[env:esp32s3_uart]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DAUTOSIM_LINK_UART=1

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
; use the chip's native USB (the port labelled "USB", not "UART")
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAUTOSIM_LINK_USB_CDC=1

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DAUTOSIM_LINK_USB_CDC=1

; host-side unit tests of the hardware independent code in lib/autosim_proto (needs a native g++)
[env:native]
platform = native
framework =
lib_deps =
build_unflags =
build_src_flags =
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -DAUTOSIM_HOST_TEST=1
test_build_src = no

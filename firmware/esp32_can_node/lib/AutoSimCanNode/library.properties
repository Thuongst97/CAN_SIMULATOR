sentence=ESP32 + MCP2518FD CAN / CAN FD node for AutoSim Studio.
paragraph=Turns an ESP32, ESP32-S3 or ESP32-C3 with an MCP2518FD module into a CAN / CAN FD channel of AutoSim Studio over USB: frames, bit rates up to 1 Mbit/s nominal and 8 Mbit/s data, sample points, transmitter delay compensation, bus error reports. Includes the ACAN2517FD 2.1.16 driver by Pierre Molinaro (MIT): no other library to install.
